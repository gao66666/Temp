[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "video-task"
version = "0.1.0"
description = "Redis Streams based video frame extraction task service"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic-settings>=2.6,<3",
  "redis>=5.2,<7",
  "sqlalchemy>=2.0,<2.1",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<8",
]

[project.scripts]
video-api = "video_task.runners.api:main"
video-worker = "video_task.runners.worker:main"
video-scheduler = "video_task.runners.scheduler:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "integration: requires the local Docker Redis service",
]
